name: Primeiro CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  Compilar:
    # criar maquina virtual para usar no pipeline
    runs-on: ubuntu-latest
    
    steps:
      - name: Fazer o git clone
        uses: actions/checkout@v4

      - name: Executando primeiro comando
        run: echo "Amo DEVOPS:)"
              
      - name: Executando dois ou mais comandos
        run: |
          ls -l
          echo "Fim do PROCESSO"
  
  Publicar:
    # criar maquina virtual para usar no pipeline
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy GitHub Pages site
        uses: actions/deploy-pages@v5.0.1
        with:
          token: # default is ${{ github.token }}
          # Name of the artifact to deploy
          artifact_name: site
    
